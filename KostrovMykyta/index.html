<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сапер (Minesweeper) — Практична робота №2 (JavaScript &amp; DOM)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-container">
    <section class="minesweeper-card" aria-label="Інтерактивна гра Сапер на JavaScript">
      <div class="window-topbar">
        <div class="window-title">
          <span class="window-title__icon">💣</span>
          <h1 class="window-title__text">Сапер — JavaScript &amp; DOM</h1>
        </div>
        <div class="controls-bar">
          <label for="difficulty-select" class="controls-bar__label">Складність:</label>
          <select id="difficulty-select" class="controls-bar__select" aria-label="Вибір складності">
            <option value="beginner">Початковий (9×9, 10 мін)</option>
            <option value="standard" selected>Стандартний (10×10, 15 мін)</option>
            <option value="intermediate">Середній (16×16, 40 мін)</option>
          </select>
          <button type="button" id="new-game-btn" class="controls-bar__btn">Нова гра</button>
        </div>
      </div>

      <header class="game-header">
        <div class="digital-display" title="Залишилось прапорців">
          <span class="digital-display__label">ПРАПОРЦІ</span>
          <span id="flags-counter" class="digital-display__digits">015</span>
        </div>

        <button type="button" id="restart-btn" class="restart-btn" title="Перезапустити гру">
          <span id="status-emoji" class="restart-btn__emoji">😊</span>
        </button>

        <div class="digital-display" title="Час гри у секундах">
          <span class="digital-display__label">ЧАС</span>
          <span id="timer-display" class="digital-display__digits">000</span>
        </div>
      </header>

      <div id="status-banner" class="status-banner status-banner--process" role="status" aria-live="polite">
        Статус: У процесі гри — зробіть перший хід (перший клік завжди безпечний)
      </div>

      <section class="board-wrapper">
        <div id="game-board" class="game-board" role="grid" aria-label="Ігрове поле Сапера"></div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
